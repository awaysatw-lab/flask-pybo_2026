{%extends 'base.html'%}
{%block content %}
<link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
<h5>
    {{question.subject}}
</h5>
<div>{{question.content}}</div>

<h5>{{ question.answer_set|length }}개의 답변이 있습니다.</h5>
<ul>
     {% for answer in question.answer_set %}
     <li>{{ answer.content }}</li>
     {% endfor %}
</ul>

<form action="{{ url_for('answer.create',question_id=question.id)}}" method="post">
    <textarea name="content" id="content"  rows="8"></textarea>
    <button type="submit">"답변등록"class=btn btn-primary</button>
</form>

{% end block %}
